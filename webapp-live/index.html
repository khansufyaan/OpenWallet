<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWallet</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --muted: #86868b; --line: #ececf1;
    --blue: #0071e3; --blue-dark: #0060c0; --green: #34c759; --red: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
         font-size: 15px; line-height: 1.45; }
  .app { max-width: 460px; margin: 0 auto; padding: 18px 16px 60px; }

  /* ---------- connect screen ---------- */
  .hero { text-align: center; padding: 56px 0 30px; }
  .logo { width: 58px; height: 58px; border-radius: 16px; margin: 0 auto 16px;
          background: linear-gradient(135deg, #0071e3, #5ac8fa); display: flex;
          align-items: center; justify-content: center; color: #fff; font-size: 26px; font-weight: 700; }
  .hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .hero p { color: var(--muted); margin-top: 6px; }
  .accounts { margin-top: 26px; }
  .account { display: flex; align-items: center; gap: 13px; background: var(--card);
             border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
             border: 1px solid transparent; transition: border .15s, transform .1s;
             box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .account:hover { border-color: var(--blue); }
  .account:active { transform: scale(.99); }
  .account .who { flex: 1; text-align: left; }
  .account .who b { display: block; font-size: 15px; }
  .account .who span { font-size: 12.5px; color: var(--muted); }
  .account .bal { font-weight: 600; color: var(--ink); }
  .fineprint { color: #b0b0b6; font-size: 11.5px; text-align: center; margin-top: 22px; line-height: 1.5; }

  /* ---------- shared ---------- */
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #fff; font-weight: 600; font-size: 15px; flex: none; }
  .card { background: var(--card); border-radius: 18px; padding: 20px;
          box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  button { font: inherit; cursor: pointer; }
  .primary { border: 0; background: var(--blue); color: #fff; font-weight: 600; font-size: 15px;
             padding: 13px; border-radius: 14px; width: 100%; transition: background .15s, transform .1s; }
  .primary:hover { background: var(--blue-dark); }
  .primary:active { transform: scale(.99); }
  .primary:disabled { opacity: .45; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4);
          border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite;
          vertical-align: -2px; margin-right: 7px; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- home ---------- */
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .topbar .chip { display: flex; align-items: center; gap: 9px; background: var(--card);
                  border: 0; border-radius: 999px; padding: 6px 14px 6px 7px;
                  box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .topbar .chip .avatar { width: 28px; height: 28px; font-size: 12px; }
  .topbar .chip b { font-size: 13.5px; }
  .topbar .addr { flex: 1; text-align: left; border: 0; background: none; color: var(--muted);
                  font-size: 12px; font-family: ui-monospace, Menlo, monospace; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  .topbar .out { border: 0; background: none; color: var(--muted); font-size: 12.5px; }
  .topbar .out:hover { color: var(--red); }
  .net { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .net .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .net.down .dot { background: var(--red); }

  .balcard { text-align: center; padding: 30px 20px 24px; }
  .balcard .label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .balcard .big { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; margin-top: 2px; }
  .balcard .big small { font-size: 20px; color: var(--muted); font-weight: 500; }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .actions button { flex: 1; border: 0; border-radius: 14px; padding: 12px 0 10px; background: #f0f0f4;
                    font-weight: 600; font-size: 13.5px; color: var(--ink); transition: background .15s; }
  .actions button:hover { background: #e6e6ec; }
  .actions button .ic { display: block; font-size: 19px; margin-bottom: 3px; }
  .actions button.send { background: var(--blue); color: #fff; }
  .actions button.send:hover { background: var(--blue-dark); }

  h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 24px 4px 10px; }
  .txn { display: flex; align-items: center; gap: 12px; padding: 12px 4px;
         border-top: 1px solid var(--line); animation: fadein .35s ease; }
  .txn:first-of-type { border-top: 0; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .txn .who { flex: 1; min-width: 0; }
  .txn .who b { display: block; font-size: 14.5px; font-weight: 600; }
  .txn .who span { font-size: 12.5px; color: var(--muted); display: block; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
  .txn .right { text-align: right; }
  .txn .amt { font-weight: 650; font-size: 15px; }
  .txn .amt.in { color: var(--green); }
  .txn .t { font-size: 11.5px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 26px 10px; }

  /* ---------- sheet ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.32); display: flex;
           align-items: flex-end; justify-content: center; z-index: 10; animation: dim .2s ease; }
  @keyframes dim { from { opacity: 0; } }
  .sheet { background: var(--card); border-radius: 22px 22px 0 0; width: 100%; max-width: 460px;
           padding: 22px 22px 30px; animation: up .25s ease; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } }
  .sheet h2 { font-size: 19px; font-weight: 700; margin-bottom: 16px; }
  .sheet label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 14px 2px 6px; }
  .sheet input, .sheet select {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: #fafafc; outline: none; }
  .sheet input:focus, .sheet select:focus { border-color: var(--blue); background: #fff; }
  .amount-input { display: flex; align-items: center; border: 1.5px solid var(--line);
                  border-radius: 12px; background: #fafafc; padding: 0 14px; }
  .amount-input:focus-within { border-color: var(--blue); background: #fff; }
  .amount-input span { font-size: 22px; color: var(--muted); }
  .amount-input input { border: 0; background: none; font-size: 26px; font-weight: 650; padding: 12px 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .sheet .primary { margin-top: 18px; }
  .cancel { display: block; width: 100%; border: 0; background: none; color: var(--blue);
            font-weight: 500; padding: 12px 0 0; }
  .copybox { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: #fafafc;
             border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; word-break: break-all;
             color: var(--ink); }
  .success { text-align: center; padding: 18px 0 6px; }
  .success .check { width: 58px; height: 58px; border-radius: 50%; background: var(--green); color: #fff;
                    font-size: 28px; display: flex; align-items: center; justify-content: center;
                    margin: 0 auto 12px; animation: pop .3s ease; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
"use strict";

/* ================= accounts & config ================= */
const ACCOUNTS = [
  { name: "IssuerA",      label: "Personal account" },
  { name: "IssuerB",      label: "Personal account" },
  { name: "AcquirerC",    label: "Business account" },
  { name: "VisaTreasury", label: "Treasury account" },
  { name: "Regulator",    label: "Read-only oversight" },
  { name: "CircleUSDC",   label: "Issuer account" },
];
const PALETTE = ["#ff6759", "#34c759", "#ff9f0a", "#0071e3", "#af52de", "#5ac8fa"];
const colorOf = n => PALETTE[ACCOUNTS.findIndex(a => a.name === n) >= 0
  ? ACCOUNTS.findIndex(a => a.name === n) : 0];
const TPL = {
  UsdcHolding: "#visa-settlement:Visa.Settlement.Usdc:UsdcHolding",
  TransferNote: "#visa-settlement:Visa.Settlement.Usdc:TransferNote",
};
const FAUCET_AMOUNT = 1000;

/* ================= ledger client ================= */
let PARTY = {};
let cmdSeq = 0, failStreak = 0;
const short = p => (p || "").split("::")[0];

async function api(path, body) {
  const res = await fetch("/api/v2" + path, {
    method: body !== undefined ? "POST" : "GET",
    headers: { "content-type": "application/json" },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = { raw: text }; }
  if (!res.ok || (data && data.code)) throw new Error(data.cause || data.code || ("HTTP " + res.status));
  return data;
}

async function loadParties() {
  const d = await api("/parties");
  const names = ACCOUNTS.map(a => a.name);
  for (const pd of d.partyDetails || []) {
    const n = short(pd.party);
    if (names.includes(n)) PARTY[n] = pd.party;
  }
  for (const n of names.filter(n => !PARTY[n])) {
    const r = await api("/parties", { partyIdHint: n, identityProviderId: "" });
    PARTY[n] = r.partyDetails.party;
  }
}

async function acs(name) {
  const end = await api("/state/ledger-end");
  if (!end.offset) return [];
  const rows = await api("/state/active-contracts", {
    eventFormat: {
      filtersByParty: { [PARTY[name]]: { cumulative: [
        { identifierFilter: { WildcardFilter: { value: { includeCreatedEventBlob: false } } } }] } },
      verbose: true },
    activeAtOffset: end.offset,
  });
  return rows
    .map(r => r.contractEntry && r.contractEntry.JsActiveContract && r.contractEntry.JsActiveContract.createdEvent)
    .filter(Boolean)
    .map(ev => ({ cid: ev.contractId, template: ev.templateId.split(":")[2], payload: ev.createArgument }));
}

async function submitAs(actor, commands) {
  return api("/commands/submit-and-wait", {
    commands, commandId: `wallet-${Date.now()}-${++cmdSeq}`, userId: "openwallet",
    actAs: [PARTY[actor]], readAs: [] });
}
const createCmd = (t, args) => ({ CreateCommand: { templateId: TPL[t], createArguments: args } });
const exerciseCmd = (t, cid, choice, arg) =>
  ({ ExerciseCommand: { templateId: TPL[t], contractId: cid, choice, choiceArgument: arg || {} } });
const toDec = n => Number.isInteger(Number(n)) ? Number(n) + ".0" : String(Number(n));

/* ================= wallet operations ================= */
const holdingsOf = (view, me) =>
  view.filter(c => c.template === "UsdcHolding" && short(c.payload.owner) === me)
      .map(c => ({ cid: c.cid, amount: Number(c.payload.amount) }))
      .sort((a, b) => b.amount - a.amount);

async function sendPayment(me, recipientName, amount, memo) {
  let mine = holdingsOf(await acs(me), me);
  const total = mine.reduce((s, h) => s + h.amount, 0);
  if (total < amount) throw new Error("Insufficient balance");
  // consolidate holdings until one can cover the payment (UTXO management)
  while (mine[0].amount < amount) {
    await submitAs(me, [exerciseCmd("UsdcHolding", mine[0].cid, "Merge", { otherCid: mine[1].cid })]);
    mine = holdingsOf(await acs(me), me);
  }
  await submitAs(me, [exerciseCmd("UsdcHolding", mine[0].cid, "Send",
    { recipient: PARTY[recipientName], sendAmount: toDec(amount), memo: memo || "" })]);
}

async function faucet(me) {
  await submitAs("CircleUSDC", [
    createCmd("UsdcHolding", { issuer: PARTY.CircleUSDC, owner: PARTY[me],
      amount: toDec(FAUCET_AMOUNT), observers: [] }),
    createCmd("TransferNote", { sender: PARTY.CircleUSDC, recipient: PARTY[me],
      amount: toDec(FAUCET_AMOUNT), sentAt: new Date().toISOString(), memo: "Test funds" }),
  ]);
}

/* ================= app state ================= */
const state = {
  screen: "connect",        // connect | home
  me: null,
  balance: 0, holdings: 0, history: [],
  connectBalances: {},
  sheet: null,              // null | send | receive | sent
  busy: false, sendError: "", lastSent: null,
  netUp: true,
};

async function refresh() {
  if (!state.me) return;
  try {
    const view = await acs(state.me);
    const mine = holdingsOf(view, state.me);
    state.balance = mine.reduce((s, h) => s + h.amount, 0);
    state.holdings = mine.length;
    state.history = view
      .filter(c => c.template === "TransferNote")
      .map(c => ({
        out: short(c.payload.sender) === state.me,
        other: short(c.payload.sender) === state.me ? short(c.payload.recipient) : short(c.payload.sender),
        amount: Number(c.payload.amount),
        memo: c.payload.memo,
        at: new Date(c.payload.sentAt),
      }))
      .sort((a, b) => b.at - a.at);
    failStreak = 0; state.netUp = true;
  } catch (e) {
    if (++failStreak >= 2) state.netUp = false;
  }
  render();
}

/* ================= UI ================= */
const money = n => "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const avatar = (n, cls) => `<div class="avatar ${cls || ""}" style="background:${colorOf(n)}">${n.slice(0, 1)}</div>`;
const timeOf = d => {
  const today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
               : d.toLocaleDateString([], { month: "short", day: "numeric" });
};

function render() {
  document.getElementById("app").innerHTML =
    state.screen === "connect" ? renderConnect() : renderHome();
}

function renderConnect() {
  return `
  <div class="hero">
    <div class="logo">O</div>
    <h1>OpenWallet</h1>
    <p>USDC on the Canton Network</p>
  </div>
  <div class="accounts">
    ${ACCOUNTS.map(a => `
      <button class="account" onclick="connect('${a.name}')">
        ${avatar(a.name)}
        <span class="who"><b>${a.name}</b><span>${a.label}</span></span>
        <span class="bal">${state.connectBalances[a.name] !== undefined ? money(state.connectBalances[a.name]) : ""}</span>
      </button>`).join("")}
  </div>
  <p class="fineprint">Sandbox wallet — these accounts live on a local Canton participant and every
  action is a real Daml transaction. In production this screen is a CIP-103
  <code>window.canton</code> wallet provider (BitGo, Dfns, Blockdaemon, …).</p>`;
}

function renderHome() {
  const addr = PARTY[state.me] || "";
  return `
  <div class="topbar">
    <button class="chip" onclick="openSheet('receive')" title="Show address">
      ${avatar(state.me)}<b>${state.me}</b>
    </button>
    <button class="addr" onclick="copyAddr()" title="Copy address">${addr.slice(0, 22)}…</button>
    <span class="net ${state.netUp ? "" : "down"}"><span class="dot"></span>${state.netUp ? "Canton" : "offline"}</span>
    <button class="out" onclick="disconnect()">Sign out</button>
  </div>

  <div class="card balcard">
    <div class="label">Balance</div>
    <div class="big">${money(state.balance)} <small>USDC</small></div>
    <div class="actions">
      <button class="send" onclick="openSheet('send')"><span class="ic">↑</span>Send</button>
      <button onclick="openSheet('receive')"><span class="ic">↓</span>Receive</button>
      <button onclick="runFaucet(this)"><span class="ic">＋</span>Add funds</button>
    </div>
  </div>

  <h3>Activity</h3>
  <div class="card" style="padding: 6px 16px;">
    ${state.history.length ? state.history.map(h => `
      <div class="txn">
        ${avatar(h.other)}
        <span class="who">
          <b>${h.out ? "To " : "From "}${h.other}</b>
          <span>${esc(h.memo) || (h.out ? "Sent" : "Received")}</span>
        </span>
        <span class="right">
          <div class="amt ${h.out ? "" : "in"}">${h.out ? "−" : "+"}${money(h.amount)}</div>
          <div class="t">${timeOf(h.at)}</div>
        </span>
      </div>`).join("")
    : `<div class="empty">No payments yet.<br>Add funds, then send USDC to another account.</div>`}
  </div>
  <p class="fineprint">${state.holdings} holding contract${state.holdings === 1 ? "" : "s"} on ledger ·
    history is the on-ledger TransferNote contracts you are a stakeholder of</p>
  ${state.sheet ? renderSheet() : ""}`;
}

function renderSheet() {
  let inner = "";
  if (state.sheet === "send") {
    const others = ACCOUNTS.filter(a => a.name !== state.me);
    inner = `
      <h2>Send USDC</h2>
      <label>To</label>
      <select id="sendTo">${others.map(a => `<option value="${a.name}">${a.name} — ${a.label}</option>`).join("")}</select>
      <label>Amount</label>
      <div class="amount-input"><span>$</span><input id="sendAmt" type="number" min="0" step="any" placeholder="0" autofocus></div>
      <div class="hint">Available: ${money(state.balance)}</div>
      <label>Note (optional)</label>
      <input id="sendMemo" type="text" maxlength="60" placeholder="What's it for?">
      <div class="error">${esc(state.sendError)}</div>
      <button class="primary" id="sendBtn" onclick="runSend()" ${state.busy ? "disabled" : ""}>
        ${state.busy ? '<span class="spin"></span>Sending…' : "Send"}</button>
      <button class="cancel" onclick="closeSheet()">Cancel</button>`;
  } else if (state.sheet === "receive") {
    inner = `
      <h2>Receive</h2>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">
        Share your Canton party ID. Anyone can send USDC to it — only you will see the payment.</p>
      <div class="copybox">${PARTY[state.me]}</div>
      <button class="primary" onclick="copyAddr(); closeSheet()">Copy address</button>
      <button class="cancel" onclick="closeSheet()">Done</button>`;
  } else if (state.sheet === "sent") {
    inner = `
      <div class="success">
        <div class="check">✓</div>
        <h2 style="margin-bottom:4px">Sent</h2>
        <p style="color:var(--muted)">${money(state.lastSent.amount)} to ${state.lastSent.to}</p>
        <p style="color:var(--muted);font-size:12px;margin-top:6px">committed on Canton in one atomic transaction</p>
      </div>
      <button class="primary" onclick="closeSheet()">Done</button>`;
  }
  return `<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet">${inner}</div></div>`;
}

/* ================= actions ================= */
async function connect(name) {
  state.me = name; state.screen = "home"; state.sheet = null;
  localStorage.setItem("openwallet.account", name);
  render();
  await refresh();
}
function disconnect() {
  state.me = null; state.screen = "connect";
  localStorage.removeItem("openwallet.account");
  render();
  loadConnectBalances();
}
function openSheet(s) { state.sheet = s; state.sendError = ""; render(); }
function closeSheet() { state.sheet = null; state.busy = false; render(); }
function copyAddr() { navigator.clipboard && navigator.clipboard.writeText(PARTY[state.me] || ""); }

async function runSend() {
  const to = document.getElementById("sendTo").value;
  const amt = Number(document.getElementById("sendAmt").value);
  const memo = document.getElementById("sendMemo").value.trim();
  state.sendError = "";
  if (!amt || amt <= 0) { state.sendError = "Enter an amount."; render(); return; }
  if (amt > state.balance) { state.sendError = "That's more than your balance."; render(); return; }
  state.busy = true; render();
  try {
    await sendPayment(state.me, to, amt, memo);
    state.lastSent = { amount: amt, to };
    state.busy = false; state.sheet = "sent";
    await refresh();
  } catch (e) {
    state.busy = false;
    state.sendError = "The ledger rejected the payment: " + e.message.slice(0, 120);
    render();
  }
}

async function runFaucet(btn) {
  if (state.busy) return;
  state.busy = true; if (btn) btn.disabled = true;
  try { await faucet(state.me); } catch (e) { /* surfaced by balance not changing */ }
  state.busy = false;
  await refresh();
}

async function loadConnectBalances() {
  for (const a of ACCOUNTS) {
    try {
      const view = await acs(a.name);
      state.connectBalances[a.name] = holdingsOf(view, a.name).reduce((s, h) => s + h.amount, 0);
      if (state.screen === "connect") render();
    } catch (e) { break; }
  }
}

/* ================= init ================= */
(async function init() {
  render();
  try {
    await loadParties();
    const saved = localStorage.getItem("openwallet.account");
    if (saved && PARTY[saved]) { await connect(saved); }
    else { render(); loadConnectBalances(); }
    setInterval(() => { if (!state.busy && state.screen === "home") refresh(); }, 5000);
  } catch (e) {
    state.netUp = false; render();
  }
})();
</script>
</body>
</html>
